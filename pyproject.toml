[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "droprag"
version = "0.1.0"
description = "Drop files, build your personal RAG knowledge base — one-click universal RAG"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Ye Yongfeng", email = "2498719131@qq.com"},
]
keywords = ["rag", "knowledge-base", "semantic-search", "drop", "universal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment :: File Managers",
]

dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sqlite-vec>=0.1.6",
    "numpy>=1.24.0",
    "watchdog>=3.0.0",
    "pyyaml>=6.0",
    "chardet>=5.0.0",
]

[project.optional-dependencies]
pdf = ["pypdf>=3.0.0", "PyMuPDF>=1.23.0"]
office = ["python-docx>=0.8.11", "openpyxl>=3.1.0", "python-pptx>=0.6.21"]
ocr = ["pytesseract>=0.3.10", "Pillow>=10.0.0"]
epub = ["ebooklib>=0.18"]
html = ["beautifulsoup4>=4.12.0", "lxml>=4.9.0"]
onnx = ["onnxruntime>=1.16.0"]
torch = ["sentence-transformers>=2.2.0", "torch>=2.0.0"]
api = ["httpx>=0.25.0"]
viz = ["umap-learn>=0.5.0", "scikit-learn>=1.3.0"]
all-loaders = ["droprag[pdf,office,html]"]
all = ["droprag[pdf,office,ocr,epub,html,onnx,api,viz]"]
dev = ["pytest>=7.0.0", "pytest-asyncio>=0.21.0", "httpx>=0.25.0"]

[project.scripts]
droprag = "droprag.cli:main"

[tool.setuptools.packages.find]
include = ["droprag*"]
